<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV - Kisra Maroua</title>
    <style>
        /* ... (كل الـ CSS السابق يبقى كما هو) ... */
    </style>
</head>
<body>
    <!-- ... (كل الـ HTML السابق يبقى كما هو) ... -->

    <script>
        // Données des matières (pour le modal)
        const matieresData = {
            // ... (بيانات المواد تبقى كما هي) ...
        };

        // Gestion de la navigation par boutons
        document.addEventListener('DOMContentLoaded', function() {
            const buttons = document.querySelectorAll('.nav-btn');
            const sections = document.querySelectorAll('.content-section');
            
            buttons.forEach(button => {
                button.addEventListener('click', function() {
                    const targetId = this.getAttribute('data-target');
                    
                    // Mettre à jour les boutons actifs
                    buttons.forEach(btn => btn.classList.remove('active'));
                    this.classList.add('active');
                    
                    // Afficher la section cible
                    sections.forEach(section => {
                        section.classList.remove('active');
                        if (section.id === targetId) {
                            section.classList.add('active');
                        }
                    });
                });
            });
            
            // Gestion des cartes de matières
            const matiereCards = document.querySelectorAll('.matiere-card');
            const modal = document.getElementById('matiereModal');
            const closeModal = document.querySelector('.close-modal');
            const modalContent = document.getElementById('modalContent');
            
            matiereCards.forEach(card => {
                card.addEventListener('click', function() {
                    const matiereId = this.getAttribute('data-matiere');
                    const matiere = matieresData[matiereId];
                    
                    if (matiere) {
                        let content = `<h2>${matiere.titre}</h2>`;
                        content += `<p>${matiere.description}</p>`;
                        
                        content += `<h3>Objectifs d'apprentissage</h3>`;
                        content += `<ul>`;
                        matiere.objectifs.forEach(objectif => {
                            content += `<li>${objectif}</li>`;
                        });
                        content += `</ul>`;
                        
                        content += `<h3>Projets réalisés</h3>`;
                        content += `<ul>`;
                        matiere.projets.forEach(projet => {
                            content += `<li>${projet}</li>`;
                        });
                        content += `</ul>`;
                        
                        modalContent.innerHTML = content;
                        modal.style.display = 'flex';
                    }
                });
            });
            
            // Fermer le modal
            closeModal.addEventListener('click', function() {
                modal.style.display = 'none';
            });
            
            window.addEventListener('click', function(event) {
                if (event.target === modal) {
                    modal.style.display = 'none';
                }
            });
            
            // ========== GESTION DES TPs - CODE CORRIGÉ ==========
            
            // Variables pour la gestion des fichiers
            let selectedFiles = [];
            const fileUploadArea = document.getElementById('fileUploadArea');
            const fileInput = document.getElementById('fileInput');
            const filePreview = document.getElementById('filePreview');
            const tpForm = document.getElementById('tpForm');
            const tpList = document.getElementById('tpList');
            
            // Extensions autorisées
            const allowedExtensions = ['.pdf', '.doc', '.docx', '.zip', '.rar', '.java', '.py', '.html', '.css', '.js', '.php', '.sql', '.blend', '.obj', '.fbx', '.stl'];
            
            // Ouvrir le sélecteur de fichiers
            fileUploadArea.addEventListener('click', function() {
                fileInput.click();
            });
            
            // Gérer la sélection de fichiers
            fileInput.addEventListener('change', function(e) {
                handleFiles(e.target.files);
            });
            
            // Gérer le drag and drop
            fileUploadArea.addEventListener('dragover', function(e) {
                e.preventDefault();
                fileUploadArea.classList.add('dragover');
            });
            
            fileUploadArea.addEventListener('dragleave', function() {
                fileUploadArea.classList.remove('dragover');
            });
            
            fileUploadArea.addEventListener('drop', function(e) {
                e.preventDefault();
                fileUploadArea.classList.remove('dragover');
                handleFiles(e.dataTransfer.files);
            });
            
            function handleFiles(files) {
                for (let file of files) {
                    const fileExtension = '.' + file.name.split('.').pop().toLowerCase();
                    if (!allowedExtensions.includes(fileExtension)) {
                        alert(`Le format ${fileExtension} n'est pas autorisé. Formats acceptés: ${allowedExtensions.join(', ')}`);
                        continue;
                    }
                    
                    if (!selectedFiles.some(f => f.name === file.name && f.size === file.size)) {
                        selectedFiles.push(file);
                    }
                }
                updateFilePreview();
            }
            
            function updateFilePreview() {
                if (selectedFiles.length === 0) {
                    filePreview.style.display = 'none';
                    return;
                }
                
                filePreview.style.display = 'block';
                filePreview.innerHTML = '';
                
                selectedFiles.forEach((file, index) => {
                    const fileItem = document.createElement('div');
                    fileItem.className = 'file-item';
                    
                    const extension = file.name.split('.').pop().toLowerCase();
                    let icon = '📄';
                    
                    if (['pdf'].includes(extension)) icon = '📕';
                    else if (['doc', 'docx'].includes(extension)) icon = '📘';
                    else if (['zip', 'rar'].includes(extension)) icon = '📦';
                    else if (['java', 'py', 'js', 'php', 'html', 'css', 'sql'].includes(extension)) icon = '📝';
                    else if (['blend', 'obj', 'fbx', 'stl'].includes(extension)) icon = '🎨';
                    
                    fileItem.innerHTML = `
                        <span class="file-icon">${icon}</span>
                        <span class="file-name">${file.name}</span>
                        <span class="file-size">${formatFileSize(file.size)}</span>
                        <span class="remove-file" data-index="${index}">✕</span>
                    `;
                    
                    filePreview.appendChild(fileItem);
                });
                
                // Ajouter les événements pour supprimer les fichiers
                document.querySelectorAll('.remove-file').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const index = parseInt(this.getAttribute('data-index'));
                        selectedFiles.splice(index, 1);
                        updateFilePreview();
                    });
                });
            }
            
            function formatFileSize(bytes) {
                if (bytes === 0) return '0 Bytes';
                const k = 1024;
                const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            }
            
            // Gestion du formulaire TP
            tpForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const matiere = document.getElementById('tpMatiere').value;
                const titre = document.getElementById('tpTitre').value;
                const description = document.getElementById('tpDescription').value;
                const date = document.getElementById('tpDate').value;
                const statut = document.getElementById('tpStatut').value;
                
                // Vérifier que tous les champs obligatoires sont remplis
                if (!matiere || !titre || !description || !date || !statut) {
                    alert('Veuillez remplir tous les champs obligatoires.');
                    return;
                }
                
                // Convertir les fichiers en base64
                const filesData = [];
                if (selectedFiles.length > 0) {
                    for (let file of selectedFiles) {
                        try {
                            const base64 = await fileToBase64(file);
                            filesData.push({
                                name: file.name,
                                size: file.size,
                                type: file.type,
                                data: base64
                            });
                        } catch (error) {
                            console.error('Erreur de conversion du fichier:', error);
                            alert(`Erreur lors de la conversion du fichier ${file.name}`);
                        }
                    }
                }
                
                // Créer le nouvel objet TP
                const newTp = {
                    id: generateId(),
                    matiere,
                    titre,
                    description,
                    date,
                    statut,
                    files: filesData,
                    createdAt: new Date().toISOString()
                };
                
                // Récupérer les TPs existants
                const existingTps = JSON.parse(localStorage.getItem('tps')) || [];
                
                // Ajouter le nouveau TP
                existingTps.push(newTp);
                
                // Sauvegarder dans le localStorage
                localStorage.setItem('tps', JSON.stringify(existingTps));
                
                // Recharger l'affichage
                renderTps(existingTps);
                
                // Réinitialiser le formulaire
                tpForm.reset();
                selectedFiles = [];
                updateFilePreview();
                
                alert('TP ajouté avec succès!');
            });
            
            // Fonctions utilitaires
            function generateId() {
                return Date.now().toString(36) + Math.random().toString(36).substr(2);
            }
            
            function fileToBase64(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.readAsDataURL(file);
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = error => reject(error);
                });
            }
            
            function base64ToBlob(base64) {
                const byteString = atob(base64.split(',')[1]);
                const mimeString = base64.split(',')[0].split(':')[1].split(';')[0];
                const ab = new ArrayBuffer(byteString.length);
                const ia = new Uint8Array(ab);
                for (let i = 0; i < byteString.length; i++) {
                    ia[i] = byteString.charCodeAt(i);
                }
                return new Blob([ab], {type: mimeString});
            }
            
            // Afficher les TPs
            function renderTps(tps) {
                tpList.innerHTML = '';
                
                if (tps.length === 0) {
                    tpList.innerHTML = `
                        <div class="empty-state">
                            <p>📝 Aucun TP enregistré pour le moment.</p>
                            <p>Commencez par ajouter votre premier travail pratique en utilisant le formulaire ci-dessus.</p>
                        </div>
                    `;
                    return;
                }
                
                // Trier les TPs par date (du plus récent au plus ancien)
                tps.sort((a, b) => new Date(b.date) - new Date(a.date));
                
                tps.forEach(tp => {
                    const tpCard = document.createElement('div');
                    tpCard.className = 'tp-card';
                    
                    let filesHtml = '';
                    if (tp.files && tp.files.length > 0) {
                        filesHtml = '<div class="tp-files"><strong>Fichiers:</strong><br>';
                        tp.files.forEach((file, index) => {
                            filesHtml += `<a class="file-badge" href="#" data-tp-id="${tp.id}" data-file-index="${index}">${file.name}</a>`;
                        });
                        filesHtml += '</div>';
                    }
                    
                    tpCard.innerHTML = `
                        <h4>${tp.titre}</h4>
                        <p><strong>Matière:</strong> ${tp.matiere}</p>
                        <p><strong>Date:</strong> ${new Date(tp.date).toLocaleDateString('fr-FR')}</p>
                        <p><strong>Statut:</strong> <span class="statut-${tp.statut.replace(' ', '-').toLowerCase()}">${tp.statut}</span></p>
                        <p>${tp.description}</p>
                        ${filesHtml}
                        <div class="tp-actions">
                            <button class="btn btn-danger" onclick="deleteTp('${tp.id}')">Supprimer</button>
                        </div>
                    `;
                    tpList.appendChild(tpCard);
                });
                
                // Ajouter les événements pour télécharger les fichiers
                document.querySelectorAll('.file-badge').forEach(badge => {
                    badge.addEventListener('click', function(e) {
                        e.preventDefault();
                        const tpId = this.getAttribute('data-tp-id');
                        const fileIndex = parseInt(this.getAttribute('data-file-index'));
                        downloadFile(tpId, fileIndex);
                    });
                });
            }
            
            // Gestion de la sauvegarde et restauration
            document.getElementById('exportTps').addEventListener('click', function() {
                const tps = JSON.parse(localStorage.getItem('tps')) || [];
                if (tps.length === 0) {
                    alert('Aucun TP à exporter.');
                    return;
                }
                
                const dataStr = JSON.stringify(tps, null, 2);
                const dataBlob = new Blob([dataStr], {type: 'application/json'});
                
                const url = URL.createObjectURL(dataBlob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `sauvegarde_tps_${new Date().toISOString().split('T')[0]}.json`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
                
                alert('TPs exportés avec succès!');
            });
            
            document.getElementById('importTps').addEventListener('click', function() {
                document.getElementById('importFile').click();
            });
            
            document.getElementById('importFile').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = function(event) {
                    try {
                        const importedTps = JSON.parse(event.target.result);
                        
                        if (!Array.isArray(importedTps)) {
                            throw new Error('Format de fichier invalide');
                        }
                        
                        const existingTps = JSON.parse(localStorage.getItem('tps')) || [];
                        const mergedTps = [...existingTps, ...importedTps];
                        
                        const uniqueTps = mergedTps.filter((tp, index, self) => 
                            index === self.findIndex(t => t.id === tp.id)
                        );
                        
                        localStorage.setItem('tps', JSON.stringify(uniqueTps));
                        renderTps(uniqueTps);
                        
                        alert(`${importedTps.length} TPs importés avec succès!`);
                    } catch (error) {
                        alert('Erreur lors de l\'importation: ' + error.message);
                    }
                };
                reader.readAsText(file);
                e.target.value = '';
            });
            
            document.getElementById('clearAllTps').addEventListener('click', function() {
                if (confirm('Êtes-vous sûr de vouloir supprimer tous les TPs? Cette action est irréversible.')) {
                    localStorage.removeItem('tps');
                    renderTps([]);
                    alert('Tous les TPs ont été supprimés.');
                }
            });
            
            // Charger les TPs au démarrage
            const initialTps = JSON.parse(localStorage.getItem('tps')) || [];
            renderTps(initialTps);
        });
        
        // Fonctions globales
        function downloadFile(tpId, fileIndex) {
            const tps = JSON.parse(localStorage.getItem('tps')) || [];
            const tp = tps.find(t => t.id === tpId);
            
            if (tp && tp.files && tp.files[fileIndex]) {
                const file = tp.files[fileIndex];
                const byteString = atob(file.data.split(',')[1]);
                const mimeString = file.data.split(',')[0].split(':')[1].split(';')[0];
                const ab = new ArrayBuffer(byteString.length);
                const ia = new Uint8Array(ab);
                for (let i = 0; i < byteString.length; i++) {
                    ia[i] = byteString.charCodeAt(i);
                }
                const blob = new Blob([ab], {type: mimeString});
                
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = file.name;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }
        }
        
        function deleteTp(id) {
            if (!confirm('Êtes-vous sûr de vouloir supprimer ce TP?')) return;
            
            const tps = JSON.parse(localStorage.getItem('tps')) || [];
            const filteredTps = tps.filter(tp => tp.id !== id);
            
            localStorage.setItem('tps', JSON.stringify(filteredTps));
            
            // Recharger l'affichage
            const tpList = document.getElementById('tpList');
            tpList.innerHTML = '';
            
            if (filteredTps.length === 0) {
                tpList.innerHTML = `
                    <div class="empty-state">
                        <p>📝 Aucun TP enregistré pour le moment.</p>
                        <p>Commencez par ajouter votre premier travail pratique en utilisant le formulaire ci-dessus.</p>
                    </div>
                `;
                return;
            }
            
            filteredTps.sort((a, b) => new Date(b.date) - new Date(a.date));
            
            filteredTps.forEach(tp => {
                const tpCard = document.createElement('div');
                tpCard.className = 'tp-card';
                
                let filesHtml = '';
                if (tp.files && tp.files.length > 0) {
                    filesHtml = '<div class="tp-files"><strong>Fichiers:</strong><br>';
                    tp.files.forEach((file, index) => {
                        filesHtml += `<a class="file-badge" href="#" data-tp-id="${tp.id}" data-file-index="${index}">${file.name}</a>`;
                    });
                    filesHtml += '</div>';
                }
                
                tpCard.innerHTML = `
                    <h4>${tp.titre}</h4>
                    <p><strong>Matière:</strong> ${tp.matiere}</p>
                    <p><strong>Date:</strong> ${new Date(tp.date).toLocaleDateString('fr-FR')}</p>
                    <p><strong>Statut:</strong> <span class="statut-${tp.statut.replace(' ', '-').toLowerCase()}">${tp.statut}</span></p>
                    <p>${tp.description}</p>
                    ${filesHtml}
                    <div class="tp-actions">
                        <button class="btn btn-danger" onclick="deleteTp('${tp.id}')">Supprimer</button>
                    </div>
                `;
                tpList.appendChild(tpCard);
            });
            
            // Réattacher les événements de téléchargement
            document.querySelectorAll('.file-badge').forEach(badge => {
                badge.addEventListener('click', function(e) {
                    e.preventDefault();
                    const tpId = this.getAttribute('data-tp-id');
                    const fileIndex = parseInt(this.getAttribute('data-file-index'));
                    downloadFile(tpId, fileIndex);
                });
            });
        }
        
        // جعل الدوال متاحة عالمياً
        window.deleteTp = deleteTp;
        window.downloadFile = downloadFile;
    </script>
</body>
</html>
